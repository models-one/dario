name: Template Workflow capture
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
defaults:
  run:
    shell: bash
    working-directory: template-workflow
env:
  TEMPLATE_CAPTURE_WORKFLOW: template-workflow-capture.yml
  TEMPLATE_CI_WORKFLOW: template-workflow-ci.yml
permissions:
  contents: read
concurrency:
  group: template-workflow-maintenance
  cancel-in-progress: false
jobs:
  template-drift-check:
    if: github.repository == 'models-one/dario' && (github.event_name == 'workflow_dispatch' || vars.TEMPLATE_CAPTURE_ENABLED == 'true')
    runs-on: [self-hosted, '${{ vars.TEMPLATE_RUNNER_LABEL || ''template-workflow'' }}']
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.CC_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TEMPLATE_AUTO_MERGE: ${{ vars.TEMPLATE_AUTO_MERGE }}
      TEMPLATE_CC_CACHE_DIR: ${{ vars.TEMPLATE_CC_CACHE_DIR }}
      TEMPLATE_HTTP_PROXY: ${{ vars.TEMPLATE_HTTP_PROXY }}
      TEMPLATE_CC_VERSION: ${{ vars.TEMPLATE_CC_VERSION || 'latest' }}
      TEMPLATE_CLAUDE_BIN: ${{ vars.TEMPLATE_CLAUDE_BIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.CC_DRIFT_BOT_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:upstream
      - run: node scripts/automation.mjs watch
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-drift-${{ github.run_id }}
          path: |
            template-workflow/drift-summary.md
            template-workflow/rebake-summary.md
            template-workflow/label-target.txt
          if-no-files-found: ignore
