name: Template Workflow release
on:
  push:
    branches: [master]
    paths:
      - 'template-workflow/**'
      - '.github/workflows/template-workflow-release.yml'
      - '.github/workflows/template-workflow-capture.yml'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all four verified template releases
        type: boolean
        default: true
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: template-workflow-production
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'models-one/dario'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.latest.outputs.version }}
      resolved_at: ${{ steps.latest.outputs.resolved_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: latest
        working-directory: template-workflow
        run: node scripts/resolve-release-version.mjs
  capture:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            name: macos
            runner: macos-latest
          - platform: win32
            name: windows
            runner: windows-latest
          - platform: linux
            name: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: template-workflow
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: sk-template-workflow-capture
      TEMPLATE_TARGET_PLATFORM: ${{ matrix.platform }}
      TEMPLATE_RESOLVED_CC_VERSION: ${{ needs.resolve.outputs.version }}
      TEMPLATE_VERSION_RESOLVED_AT: ${{ needs.resolve.outputs.resolved_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template-workflow/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:source
      - name: Restore this platform's baseline
        run: node scripts/production-release.mjs restore
      - name: Capture, clean, detect drift and bake on the native platform
        env:
          TEMPLATE_CC_CACHE_DIR: ${{ runner.temp }}/template-claude
        run: npm run produce
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            template-workflow/artifacts/latest/
            template-workflow/artifacts/current-check.json
            template-workflow/artifacts/production-result.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            template-workflow/drift-summary.md
            template-workflow/rebake-summary.md
            template-workflow/label-target.txt
            template-workflow/capture-observation.json
          if-no-files-found: ignore
  aggregate-and-publish:
    needs: [resolve, capture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: template-workflow
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEMPLATE_RESOLVED_CC_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:source
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-darwin-${{ github.run_id }}
          path: template-workflow/artifacts/inputs/darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win32-${{ github.run_id }}
          path: template-workflow/artifacts/inputs/win32
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-${{ github.run_id }}
          path: template-workflow/artifacts/inputs/linux
      - name: Verify one complete batch and build the aggregate
        run: node scripts/aggregate.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-platforms-${{ github.run_id }}
          path: |
            template-workflow/artifacts/all/
            template-workflow/artifacts/release-set.json
          if-no-files-found: error
      - name: Publish macOS, Windows, Linux and aggregate releases
        if: github.event_name == 'push' || inputs.publish
        run: node scripts/publish-set.mjs
