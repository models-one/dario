name: Template Workflow ci
on:
  push:
    branches: [master]
    paths:
      - 'template-workflow/**'
      - '.github/workflows/template-workflow-*.yml'
  pull_request:
    paths:
      - 'template-workflow/**'
      - '.github/workflows/template-workflow-*.yml'
  workflow_dispatch:
defaults:
  run:
    shell: bash
    working-directory: template-workflow
env:
  TEMPLATE_CAPTURE_WORKFLOW: template-workflow-capture.yml
  TEMPLATE_CI_WORKFLOW: template-workflow-ci.yml
permissions:
  contents: read
jobs:
  producer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: template-workflow/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:source
      - run: npm test
      - run: npm run verify
      - run: npm run export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: produced-template-node-${{ matrix.node }}
          path: template-workflow/artifacts/latest/
          if-no-files-found: error
